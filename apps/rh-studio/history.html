<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>生成记录 · RH Studio</title>
<meta name="description" content="RH Studio generation history" />
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./history.css?v=hover-autoplay-v1">
<link rel="stylesheet" href="./graphite-console.css?v=graphite-console-1">
</head>
<body class="history-page-body">
<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>
<div class="noise"></div>

<div class="history-shell">
  <header class="history-topbar glass">
    <div class="history-title">
      <a class="history-logo" href="/">RH</a>
      <div>
        <span>GENERATION HISTORY</span>
        <strong>生成记录</strong>
      </div>
      <b id="historyCount">0</b>
    </div>

    <div class="history-actions">
      <button id="downloadLatestBatch" class="history-action-btn history-archive-btn" type="button" disabled>
        最近批量打包 <b>↓</b>
      </button>
      <button id="downloadAllHistory" class="history-action-btn history-archive-btn" type="button" disabled>
        全部记录打包 <b>↓</b>
      </button>
      <button id="clearHistory" class="history-action-btn history-clear-all-btn" type="button" disabled>
        清空记录 <b>×</b>
      </button>
      <button id="importHistoryTask" class="history-action-btn" type="button">导入 Task</button>
      <a class="history-back" href="/">返回工作台 <b>↙</b></a>
    </div>
  </header>

  <main class="history-main">
    <div id="historyList" class="history-masonry">
      <div class="history-empty">
        <strong>还没有生成记录</strong>
        <span>从工作台生成的视频会自动出现在这里。</span>
      </div>
    </div>
  </main>
</div>


<div id="historyDetailOverlay" class="history-detail-overlay hidden" aria-hidden="true">
  <button class="history-detail-backdrop" type="button" data-detail-close aria-label="关闭详情"></button>
  <section class="history-detail-modal glass" role="dialog" aria-modal="true" aria-labelledby="historyDetailTitle">
    <div class="history-detail-head">
      <div>
        <span>GENERATION DETAIL</span>
        <strong id="historyDetailTitle">生成详情</strong>
      </div>
      <button class="history-detail-close" type="button" data-detail-close aria-label="关闭">×</button>
    </div>

    <div class="history-detail-layout">
      <div id="historyDetailMedia" class="history-detail-media"></div>

      <aside class="history-detail-info">
        <div class="history-detail-summary">
          <span id="historyDetailTime">—</span>
          <strong id="historyDetailApp">—</strong>
          <i id="historyDetailStatus" class="history-status">—</i>
        </div>

        <div class="history-detail-section">
          <span>PROMPT</span>
          <p id="historyDetailPrompt">—</p>
        </div>

        <div class="history-detail-meta-grid">
          <div><span>比例</span><strong id="historyDetailAspect">—</strong></div>
          <div><span>清晰度</span><strong id="historyDetailQuality">—</strong></div>
          <div><span>时长</span><strong id="historyDetailDuration">—</strong></div>
          <div><span>实例</span><strong id="historyDetailInstance">—</strong></div>
        </div>

        <div id="historyDetailBatchWrap" class="history-detail-section compact hidden">
          <span>BATCH</span>
          <p id="historyDetailBatch">—</p>
        </div>

        <div id="historyDetailPersonaWrap" class="history-detail-section compact hidden">
          <span>PERSONA</span>
          <p id="historyDetailPersona">—</p>
        </div>

        <div class="history-detail-section compact">
          <span>TASK</span>
          <code id="historyDetailTask">—</code>
        </div>

        <div class="history-detail-actions">
          <a id="historyDetailDownload" class="history-detail-download disabled" href="#" download>下载文件 <b>↓</b></a>
          <a id="historyDetailOpen" class="history-detail-open" href="/">回到工作台 <b>↗</b></a>
        </div>
      </aside>
    </div>
  </section>
</div>

<div id="toast" class="toast"></div>
<script src="./history.js?v=hover-autoplay-v1"></script>
</body>
</html>
